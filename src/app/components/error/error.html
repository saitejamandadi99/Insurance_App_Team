<div class="container-fluid error-page d-flex align-items-center justify-content-center">

<div class="col-12 col-md-9 col-lg-6 col-xl-5">

    <div class="app-card error-card text-center">

        <div class="error-number">404</div>

        <div class="icon-badge purple mx-auto mb-4">
            <i class="bi bi-exclamation-triangle"></i>
        </div>

        <h1 class="error-title">
            Oops! Page Not Found
        </h1>

        <p class="error-description">
            The page you're looking for doesn't exist, may have been moved,
            or you don't have access to this route.
        </p>

        <div class="error-actions d-flex flex-column flex-sm-row justify-content-center gap-3 mt-4">

            <button
                type="button"
                class="btn btn-primary-custom"
                (click)="navigateToDashboard()">
                <i class="bi bi-house-door me-2"></i>
                Go to Dashboard
            </button>

            <button
                type="button"
                class="btn btn-outline-custom"
                (click)="navigateToLogin()">
                <i class="bi bi-box-arrow-in-right me-2"></i>
                Back to Login
            </button>

        </div>

    </div>

</div>

</div>
